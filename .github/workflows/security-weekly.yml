# security-weekly.yml — 週次の定期セキュリティ・健全性スキャン (reusable workflow)
#
# リリースの有無に関係なく、稼働中の本番サイトを毎週検査する:
#   - 依存パッケージの既知脆弱性 (リリース後に公開された CVE を拾う)
#   - 本番 URL のセキュリティヘッダ / 生存確認
#   - sitemap.xml ベースの全ページリンク切れ
#   - (portal のみ) OWASP ZAP ベースラインスキャン (DAST)
# 問題があれば Issue を自動起票する。caller 側で cron を定義して呼び出す。
name: security-weekly

on:
  workflow_call:
    inputs:
      site_url:
        required: true
        type: string
      profile:
        description: "static | portal"
        required: false
        default: "static"
        type: string
      runtime:
        required: false
        default: "node"
        type: string
      working_directory:
        description: "package-lock.json 等があるディレクトリ。サイトがサブディレクトリにあるリポジトリ用 (例: kazoeru = site)"
        required: false
        default: "."
        type: string
      qa_standard_ref:
        required: false
        default: "main"
        type: string

permissions:
  contents: read
  issues: write

jobs:
  dependency-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: OSV-Scanner (既知脆弱性)
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: --recursive ./
      - name: npm audit
        if: inputs.runtime == 'node'
        working-directory: ${{ inputs.working_directory }}
        run: |
          if [ -f package-lock.json ]; then npm audit --audit-level=high; else echo "lockfile なし"; fi

  production-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository_owner }}/qa-standard
          ref: ${{ inputs.qa_standard_ref }}
      - name: Smoke check
        run: node scripts/smoke-check.mjs --base "${{ inputs.site_url }}" --paths "/"
      - name: Security headers
        run: node scripts/check-headers.mjs --url "${{ inputs.site_url }}" --profile "${{ inputs.profile }}"
      - name: Fetch sitemap URLs (sitemap.xml / sitemap-index.xml 両対応)
        id: sitemap
        run: |
          # Astro (@astrojs/sitemap) は /sitemap.xml ではなく /sitemap-index.xml を吐くため両方試す。
          # sitemapindex だった場合は子サイトマップを1階層展開してページURLを集める
          # (展開しないと <loc> が子サイトマップのURLになり、全ページのリンク検査が空回りする)。
          XML="$(curl -sf "${{ inputs.site_url }}/sitemap.xml" || curl -sf "${{ inputs.site_url }}/sitemap-index.xml" || true)"
          : > sitemap-urls.txt
          if printf '%s' "$XML" | grep -q '<sitemapindex'; then
            printf '%s\n' "$XML" | grep -oE '<loc>[^<]+</loc>' | sed -E 's|</?loc>||g' | while read -r child; do
              curl -sf "$child" | grep -oE '<loc>[^<]+</loc>' | sed -E 's|</?loc>||g' >> sitemap-urls.txt || true
            done
          else
            printf '%s\n' "$XML" | grep -oE '<loc>[^<]+</loc>' | sed -E 's|</?loc>||g' >> sitemap-urls.txt || true
          fi
          echo "count=$(grep -c . sitemap-urls.txt || true)" >> "$GITHUB_OUTPUT"
          echo "収集URL数: $(grep -c . sitemap-urls.txt || true)"
          head -3 sitemap-urls.txt || echo "(sitemap なし)"
      - name: Link check (全公開ページ + 外部リンク)
        if: steps.sitemap.outputs.count != '0'
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --max-concurrency 8 --accept 200..=299,403,429 sitemap-urls.txt
          fail: true

  zap-baseline:
    if: inputs.profile == 'portal'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # OWASP ZAP ベースライン: 非攻撃のパッシブスキャン (公式が本番URL実行を想定内と明記)。
      # full scan は実攻撃を伴うため本番には絶対に向けないこと (ステージング限定)。
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ inputs.site_url }}
          allow_issue_writing: true   # ZAP が結果を Issue として自動管理

  notify-failure:
    needs: [dependency-scan, production-check]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh issue create \
            --title "🔒 週次セキュリティスキャンで問題検出: $(date -u +%Y-%m-%d)" \
            --body "週次スキャンが失敗しました。
          - サイト: ${{ inputs.site_url }}
          - 依存脆弱性: ${{ needs.dependency-scan.result }} / 本番チェック: ${{ needs.production-check.result }}
          - 実行ログ: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          対応目安: 依存脆弱性(High以上)は1週間以内に更新。ヘッダ/リンク切れは次回リリースで修正。" \
            --label "security" || true
