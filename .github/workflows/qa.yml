# qa.yml — 変更規模を自動判定し、レベルに応じた QA を実行する reusable workflow
#
# 各サイトのリポジトリからは薄い caller (templates/ 参照) で呼び出す:
#   uses: <owner>/qa-standard/.github/workflows/qa.yml@main
#
# レベルと実行内容:
#   L0 コンテンツのみ    → シークレットスキャンのみ (判定ジョブの中で実行。約1分)
#   L1 軽微なコード変更  → + lint / unit / build
#   L2 標準リリース      → + E2Eスモーク / リンク切れ / Lighthouse
#   L3 セキュリティ敏感  → + SAST / 依存脆弱性 (+ 人の承認ゲートは l3_approval: true のときだけ)
#
# Actions の分数: 課金はジョブごとに1分単位で切り上げられる。数秒で終わる検査は独立したジョブにせず、
# 既にあるジョブに同居させる(2026-10-08: secrets-scan を classify に統合・qa-gate を廃止・
# approval を任意化。docs/qa-policy.md §2-3)。
# 呼び出し側の deploy は `needs: qa` で、ここのジョブが1つでも失敗・取り消しになれば飛ぶ(実測済み)。
name: qa

on:
  workflow_call:
    inputs:
      project_type:
        description: "media | portal (portal は将来 DAST 等が追加される)"
        required: false
        default: "media"
        type: string
      runtime:
        description: "node | python"
        required: false
        default: "node"
        type: string
      build_command:
        required: false
        default: "npm run build"
        type: string
      build_output_dir:
        description: "ビルド成果物のディレクトリ (working_directory からの相対パス)"
        required: false
        default: "dist"
        type: string
      working_directory:
        description: "npm/ビルドを実行するディレクトリ。サイトがサブディレクトリにあるリポジトリ用 (例: kazoeru = site)"
        required: false
        default: "."
        type: string
      node_version:
        required: false
        default: "22"
        type: string
      python_version:
        required: false
        default: "3.12"
        type: string
      smoke_paths:
        description: "E2E/スモーク対象パス(カンマ区切り)。qa-policy.json の smoke_paths と揃える"
        required: false
        default: "/"
        type: string
      level_override:
        description: "手動レベル指定 (L0-L3)。workflow_dispatch から渡す"
        required: false
        default: ""
        type: string
      deployed_ref:
        description: >-
          本番基準モード: 本番に出て post-deploy の検証を通った最新のコミットを指すブランチ名 (例: qa-deployed)。
          指定すると main への push・手動実行の判定を「直前の push からの差分」ではなく「このブランチからの差分」
          (= 本番が実際に変わる中身)で行う。post-deploy.yml の mark_deployed_ref と同じ名前にする。空なら従来どおり
        required: false
        default: ""
        type: string
      l3_approval:
        description: >-
          L3 で人の承認ゲート(environment: qa-l3-approval の required reviewers)を通すか。
          GitHub Free / Pro / Team の private リポジトリでは required reviewers を設定できず、
          ゲートが空回り(数秒で素通り・1分課金)するだけなので既定は使わない。
          required reviewers を設定できる環境(公開リポジトリ・Enterprise)で true にする
        required: false
        default: false
        type: boolean
      qa_standard_ref:
        required: false
        default: "main"
        type: string
    outputs:
      level:
        description: "判定された QA レベル"
        value: ${{ jobs.classify.outputs.level }}

permissions:
  contents: read

jobs:
  # ---------- 1. シークレットスキャン(全レベル) + リリース規模の自動判定 ----------
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      level: ${{ steps.run.outputs.level }}
      reason: ${{ steps.run.outputs.reason }}
      run_secrets: ${{ steps.run.outputs.run_secrets }}
      run_lint: ${{ steps.run.outputs.run_lint }}
      run_unit: ${{ steps.run.outputs.run_unit }}
      run_build: ${{ steps.run.outputs.run_build }}
      run_e2e: ${{ steps.run.outputs.run_e2e }}
      run_links: ${{ steps.run.outputs.run_links }}
      run_lighthouse: ${{ steps.run.outputs.run_lighthouse }}
      run_sast: ${{ steps.run.outputs.run_sast }}
      run_sca: ${{ steps.run.outputs.run_sca }}
      needs_approval: ${{ steps.run.outputs.needs_approval }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # シークレットスキャン(全レベル。API キーの誤コミットは記事更新でも起こる事故)。
      # 以前は別ジョブ(secrets-scan)だったが、実時間は平均15秒なのに1分課金されていたので判定ジョブに同居させた
      # (2026-10-08)。qa-standard の checkout より前に置き、スキャンする中身を従来のジョブと同じにする。
      # 見つかれば判定ジョブごと落ち、後ろの検査とデプロイは全部飛ぶ。
      # TruffleHog OSS (Apache-2.0): 全履歴から API キー等の混入を検出。
      # gitleaks は Organization 利用に商用ライセンスが必要になったため不採用 (docs/qa-policy.md 参照)
      - name: TruffleHog secret scan (全レベル)
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          extra_args: --results=verified,unknown
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository_owner }}/qa-standard
          ref: ${{ inputs.qa_standard_ref }}
          path: .qa-standard
      - name: Classify release
        id: run
        # 入力・イベントの値は env 経由で渡す(run: に直接埋め込むと、値の中の記号がシェルとして解釈される)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          LEVEL_OVERRIDE: ${{ inputs.level_override }}
          DEPLOYED_REF: ${{ inputs.deployed_ref }}
        run: |
          DEPLOYED_BASE=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE_SHA"
          else
            if [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] && [ -n "$PUSH_BEFORE" ]; then
              BASE="$PUSH_BEFORE"
            else
              BASE=""  # 初回 push・手動実行: classify は head のコミットだけを見る(本番基準モードなら本番からの差分)
            fi
            # 本番基準モード: 本番に出て検証を通った最新のコミット(ブランチ $DEPLOYED_REF)からの差分で判定する。
            # L3 の実行中に積まれた L0 の push や、落ちた変更の後の小さな修正が、未検査の変更ごと
            # 低いレベルでデプロイされる穴を塞ぐ(2026-10-08 レン決定。docs/qa-policy.md §2-2)
            if [ -n "$DEPLOYED_REF" ]; then
              if ! printf '%s' "$DEPLOYED_REF" | grep -Eq '^[A-Za-z0-9._/-]+$'; then
                echo "::error::deployed_ref の名前が不正: $DEPLOYED_REF"
                exit 1
              fi
              set +e
              git ls-remote --exit-code origin "refs/heads/$DEPLOYED_REF" >/dev/null
              rc=$?
              set -e
              if [ "$rc" -eq 0 ]; then
                git fetch --no-tags origin "+refs/heads/$DEPLOYED_REF:refs/remotes/origin/$DEPLOYED_REF"
                DEPLOYED_BASE=$(git rev-parse "refs/remotes/origin/$DEPLOYED_REF")
              elif [ "$rc" -eq 2 ]; then
                # 記録がまだ無い(導入直後・ブランチ削除): 何が本番に出ていないか分からないので classify が L3 に倒す。
                # 検証を通ったデプロイで post-deploy が自動的に作る
                DEPLOYED_BASE="unknown"
                echo "::warning title=本番の検証済みコミットの記録が無い::ブランチ $DEPLOYED_REF が無いため全部検査(L3)する。検証を通ったデプロイで自動的に作られる"
              else
                echo "::error::ブランチ $DEPLOYED_REF の確認に失敗(rc=$rc)。判定の基準を決められないため止めた(Re-run で再実行する)"
                exit 1
              fi
            fi
          fi
          node .qa-standard/scripts/classify-release.mjs \
            --base "$BASE" --head "$HEAD_SHA" \
            --override "$LEVEL_OVERRIDE" --deployed-base "$DEPLOYED_BASE"
      - name: Summary
        env:
          LEVEL: ${{ steps.run.outputs.level }}
          REASON: ${{ steps.run.outputs.reason }}
          DEPLOYED_REF: ${{ inputs.deployed_ref }}
          L3_APPROVAL: ${{ inputs.l3_approval }}
        run: |
          {
            echo "## QA レベル: $LEVEL"
            echo "- 判定理由: $REASON"
            if [ -n "$DEPLOYED_REF" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
              echo "- 判定の基準: 本番に出て検証を通った最新のコミット(ブランチ \`$DEPLOYED_REF\`)からの差分。ほかの push の未検証の変更が含まれるときは、タグ・level_override は上げるのにだけ効く"
            fi
            if [ "$LEVEL" = "L3" ] && [ "$L3_APPROVAL" != "true" ]; then
              echo "- 人の承認ゲート: 使わない設定(入力 \`l3_approval\`)。GitHub Free / Pro / Team の private リポジトリでは required reviewers を設定できないため"
            fi
            echo "- 上書きしたい場合: コミットメッセージに \`[qa:L0]\`〜\`[qa:L3]\`、または workflow_dispatch の level_override"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------- 2. lint / unit / build (L1+) ----------
  build-test:
    needs: classify
    if: needs.classify.outputs.run_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - if: inputs.runtime == 'node'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working_directory }}/package-lock.json
      - if: inputs.runtime == 'python'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ inputs.python_version }}
      - name: Install deps
        run: |
          if [ "${{ inputs.runtime }}" = "node" ]; then
            npm ci
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
      - name: Lint (定義されていれば)
        run: |
          if [ "${{ inputs.runtime }}" = "node" ] && [ -f package.json ] && jq -e '.scripts.lint' package.json >/dev/null; then
            npm run lint
          else
            echo "lint スクリプト未定義のためスキップ"
          fi
      - name: Unit tests (定義されていれば)
        run: |
          if [ "${{ inputs.runtime }}" = "node" ] && [ -f package.json ] && jq -e '.scripts.test' package.json >/dev/null; then
            npm test
          elif [ "${{ inputs.runtime }}" = "python" ] && ls tests/test_*.py >/dev/null 2>&1; then
            pip install pytest && pytest -q
          else
            echo "テスト未定義のためスキップ"
          fi
      - name: Build
        run: ${{ inputs.build_command }}
      - name: Upload build output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-output
          path: ${{ inputs.working_directory }}/${{ inputs.build_output_dir }}
          retention-days: 3

  # ---------- 3. E2E スモーク + リンク切れ + Lighthouse (L2+) ----------
  e2e-quality:
    needs: [classify, build-test]
    if: needs.classify.outputs.run_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ github.repository_owner }}/qa-standard
          ref: ${{ inputs.qa_standard_ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build-output
          path: site-dist
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node_version }}
      - name: Serve build output
        run: |
          npx --yes serve -l 8788 site-dist &
          for _ in $(seq 1 30); do curl -sf http://localhost:8788 >/dev/null && break; sleep 1; done
      - name: E2E smoke (Playwright)
        env:
          SMOKE_BASE_URL: http://localhost:8788
          SMOKE_PATHS: ${{ inputs.smoke_paths }}
        run: |
          npm i --no-save @playwright/test
          npx playwright install --with-deps chromium
          npx playwright test --config config/playwright.config.mjs
      - name: Link check (サイト内リンク切れ)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # --remap: ディレクトリURLへのフラグメントリンクを root-dir で解決すると
          # 「…/site-dist#section」「…/site-dist/subsidy#section」のような拡張子なしURLになり、
          # lychee は index.html へのフォールバックをせず「Cannot find fragment」と誤検知する
          # (kazoeru のカテゴリナビ(ルート直下)と reform-soba の /subsidy/#shinsei-nagare
          # (サブディレクトリ)で実測、lychee 0.24.2)。ドットを含まないパスセグメントの並び
          # (= ディレクトリURL)に限って index.html に読み替え、フラグメント自体は実検査を維持する。
          # 「page.html#section」のような実ファイルへのリンクはセグメントにドットを含むため
          # remapされず、直接検査される。存在しないアンカーは remap後もERRORになることを
          # カナリアで確認済み(2026-08-24再確認)。除外との違いに注意。
          args: >-
            --offline --include-fragments --root-dir "$(pwd)/site-dist"
            --remap '(file://.*/site-dist(?:/[^#./]+)*)#(.*) $1/index.html#$2'
            "site-dist/**/*.html"
          fail: true
      - name: Lighthouse CI (smoke_paths のページのみ)
        env:
          SMOKE_PATHS: ${{ inputs.smoke_paths }}
        run: |
          npm i --no-save @lhci/cli
          urls=()
          IFS=',' read -ra PATHS <<< "$SMOKE_PATHS"
          for p in "${PATHS[@]}"; do urls+=("--collect.url=http://localhost:8788${p}"); done
          npx lhci autorun "${urls[@]}" --config=config/lighthouserc.json
      - name: Upload QA reports (Playwright / Lighthouse)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qa-reports
          path: |
            playwright-report
            .lighthouseci/reports
          retention-days: 7
          if-no-files-found: ignore

  # ---------- 4. セキュリティ深掘り: SAST + 依存脆弱性 (L3) ----------
  security-deep:
    needs: classify
    if: needs.classify.outputs.run_sast == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # 公式推奨のコンテナ実行 (旧 semgrep-action は 2024-04 に deprecated)。Platform未登録の完全無料運用
      - name: Semgrep SAST (Community Edition)
        run: |
          docker run --rm -v "$PWD:/src" --workdir /src \
            semgrep/semgrep semgrep scan --config p/default --error --metrics=off
      - name: OSV-Scanner (依存脆弱性)
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: --recursive ./
        continue-on-error: false
      - name: npm audit (high 以上)
        if: inputs.runtime == 'node'
        working-directory: ${{ inputs.working_directory }}
        run: |
          if [ -f package-lock.json ]; then npm audit --audit-level=high; else echo "lockfile なしのためスキップ"; fi

  # ---------- 5. L3 承認ゲート (レンの手動承認。l3_approval: true のときだけ) ----------
  # GitHub Free / Pro / Team の private リポジトリでは environment の required reviewers を設定できない
  # (GitHub Docs: deployments-and-environments)。設定できないまま毎回走らせても数秒で素通りして
  # 1分課金されるだけなので、既定では走らせない(2026-10-08)。true にした呼び出し側では従来どおり、
  # 全部の検査が通った後にレンの承認を待つ
  approval:
    needs: [classify, build-test, e2e-quality, security-deep]
    if: inputs.l3_approval && needs.classify.outputs.needs_approval == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: qa-l3-approval   # ← リポジトリ設定で required reviewers = レン を設定 (README 参照)
    steps:
      - name: Approved
        run: echo "L3 リリースがレンによって承認されました"
      - name: Verify approval gate is configured (設定漏れ検出)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # 設定を読めなかった(権限不足等)ときと、読めたが required reviewers が無いときを分けて警告する。
          # 以前は gh api の失敗時に stdout のエラー本文と `|| echo 0` の「0」がつながり、どちらの警告も出ていなかった
          if reviewers=$(gh api "repos/$REPO/environments/qa-l3-approval" \
              --jq '[.protection_rules[]? | select(.type=="required_reviewers")] | length' 2>/dev/null); then
            if [ "$reviewers" = "0" ]; then
              echo "::warning title=L3承認ゲートが素通しです::qa-l3-approval environment に required reviewers が未設定のため、L3リリースが承認なしで通過しています。リポジトリの Settings → Environments → qa-l3-approval で Required reviewers を設定してください。"
            fi
          else
            echo "::warning title=L3承認ゲートの設定を確認できない::qa-l3-approval environment の設定を読めなかった(GITHUB_TOKEN に actions: read が無い等)。Settings → Environments → qa-l3-approval で Required reviewers が設定されているか確かめてください。"
          fi

  # 最終ゲート(qa-gate)は 2026-10-08 に廃止: 呼び出し側の deploy は `needs: qa` で、ここのジョブが1つでも
  # failure / cancelled なら飛ぶ(使い捨てブランチで実測。docs/qa-policy.md §2-3)。PR の必須チェックに
  # 使う集約ジョブが要るとき(有料プランでブランチ保護を使う場合)は README「PR の必須チェック」を参照
