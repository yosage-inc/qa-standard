# 【テンプレート】ポータルサイト (Hono + D1 + Better Auth) 用 — .github/workflows/qa-deploy.yml として配置
#
# メディアとの違い:
#   - project_type: portal (ヘッダ検査が厳格化、週次で DAST が回る)
#   - D1 マイグレーションは wrangler.toml / migrations/ の変更として自動的に L3 判定される
# 必要な secrets: CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID
name: QA + Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      level_override:
        description: "QAレベルを手動指定 (L0-L3、空なら自動判定)"
        required: false
        default: ""

permissions:
  contents: read
  issues: write

jobs:
  qa:
    uses: <OWNER>/qa-standard/.github/workflows/qa.yml@main
    with:
      project_type: portal
      runtime: node
      build_command: npm run build
      build_output_dir: dist
      smoke_paths: "/,/login"            # ← 主要ページに合わせて変更
      level_override: ${{ github.event.inputs.level_override || '' }}

  deploy:
    needs: qa
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Apply D1 migrations (remote)
        run: npx wrangler d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  post-deploy:
    needs: deploy
    uses: <OWNER>/qa-standard/.github/workflows/post-deploy.yml@main
    with:
      site_url: https://<YOUR-DOMAIN>       # ← 本番ドメインに変更
      smoke_paths: "/,/login"
      profile: portal
