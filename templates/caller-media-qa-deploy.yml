# 【テンプレート】メディアサイト (Astro / node) 用 — .github/workflows/qa-deploy.yml として配置
#
# 使い方: site_url / smoke_paths を自サイトに合わせて変更する (Organization は yosage-inc 設定済み)。
# 必要な secrets (リポジトリ設定 → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID
name: QA + Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      level_override:
        description: "QAレベルを手動指定 (L0-L3、空なら自動判定)"
        required: false
        default: ""

permissions:
  contents: read
  issues: write

jobs:
  qa:
    uses: yosage-inc/qa-standard/.github/workflows/qa.yml@main
    with:
      project_type: media
      runtime: node
      build_command: npm run build
      build_output_dir: dist
      smoke_paths: "/,/about/"          # ← 主要ページに合わせて変更
      level_override: ${{ github.event.inputs.level_override || '' }}

  deploy:
    needs: qa
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  post-deploy:
    needs: deploy
    uses: yosage-inc/qa-standard/.github/workflows/post-deploy.yml@main
    with:
      site_url: https://<YOUR-DOMAIN>       # ← 本番ドメインに変更
      smoke_paths: "/,/about/"
      profile: static
